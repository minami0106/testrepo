<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="css/style.css">

     <style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #9399a0;
}

header {
    background-color: #9399a0;
    color: white;
    padding: 15px 0;
    text-align: center;
}

.nav-list {
    list-style: none;
    padding: 0;
    text-align: center;
}

.nav-list li {
    display: inline;
    margin: 0 20px;
}

.nav-list li a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

main {
    padding: 30px;
    text-align: center;
    background-color: #ffffff;
}

.contact-form {
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0px 0px 10px #9399a0(0, 0, 0, 0.2);
}

label, input, textarea, button {
    display: block;
    width: 100%;
    margin-bottom: 12px;
}

button {
    background-color: #9399a0;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

footer {
    text-align: center;
    padding: 15px;
    background-color: #9399a0;
    color: white;
    margin-top: 30px;
    font-weight: bold;
}
    </style>
</head>

<body>
    <header>
        <h1>お問い合わせ</h1>
        <nav>
             <ul class="nav-list">
                    <li><a href="testrepo.html">ホーム</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                    <li><a href="work2.html">課題</a></li>
                    <li><a href="calculate.html">電卓</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="contact-form">
                <h2>お問い合わせフォーム</h2>
                <form action="#" method="post">
                    <label for="name">名前:</label>
                    <input type="text" id="name" required><br>

                    <label for="email">メールアドレス</label>
                    <input type="email" id="email" name="email" required><br>

                    <label for="purpose">目的</label>
                    <select name="choice" id="choice">
                        <option value="not_choice">未選択</option>
                        <option value="recruitment">リクルート</option>
                        <option value="question">質問</option>
                        <option value="job_request">仕事依頼</option>
                    </select><br><br>
                    
                    <label for="message">メッセージ</label>
                    <textarea name="message" id="message" rows="5" required></textarea>

                    <button type="submit">送信</button>

                </form>
            </section>
        </main>
        <footer>
            <p>&copy; 2025 私のポートフォリオ</p>
        </footer>
    </body>

</html>
