<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #eef2f7;
    color: #9399a0;
}

header {
    background-color: #9399a0;
    color: white;
    padding: 15px 0;
    text-align: center;
}

.nav-list {
    list-style: none;
    padding: 0;
    text-align: center;
}

.nav-list li {
    display: inline;
    margin: 0 20px;
}

.nav-list li a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

main {
    padding: 30px;
    text-align: center;
    background-color: #ffffff;
}

.profile-img {
    width: 150px;
    border-radius: 50%;
    margin-bottom: 15px;
    border: 3px solid #9399a0;
}

.skills {
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    box-shadow: 0px 4px 8px#9399a0(0, 0, 0, 0.1);
}

.skill-list {
    list-style: none;
    padding: 0;
    font-weight: bold;
    color: #9399a0;
}

.skill-list li {
    background: #9399a0;
    color: white;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    display: inline-block;
}

.portfolio {
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    box-shadow: 0px 4px 8px #9399a0(0, 0, 0, 0.1);
}

.portfolio h2 {
    color: #9399a0;
    border-bottom: 3px solid #b9c0c7;
    display: inline-block;
    padding-bottom: 5px;
}

.portfolio-items {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

.portfolio-items img {
    width: 220px;
    height: 160px;
    border-radius: 8px;
    border: 3px solid #9399a0;
    background-color: #f8f9fa;
    padding: 5px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
}

.contact-form {
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0px 0px 10px #9399a0(0, 0, 0, 0.2);
}

label, input, textarea, button {
    display: block;
    width: 100%;
    margin-bottom: 12px;
}

button {
    background-color: #9399a0;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

footer {
    text-align: center;
    padding: 15px;
    background-color: #9399a0;
    color: white;
    margin-top: 30px;
    font-weight: bold;
}
    </style>
</head>
<body>
    <header>
        <h1>私のポートフォリオ</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">ホーム</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="profile">
            <h2>自己紹介</h2>
            <img src="neko.png" alt="プロフィール写真" class="profile-img">
            <p>こんにちは!私はWeb開発を学んでいるエンジニア志望者です。</p>
        </section>
        <section class="skills">
            <h2>スキル</h2>
            <ul class="skill-list" style="list-style: none; padding: 0;">
                <li>HTML・CSSの基本</li>
                <li>簡単なレイアウト作成</li>
                <li>フォームの作成</li>
            </ul>
        </section>
        <section class="portfolio">
            <h2>ポートフォリオ</h2>
            <p>これまでに作成した作品の一部を紹介します。</p>
            <article class="portfolio-card"></article>

       <div class="portfolio-grid">
      <div class="portfolio-card">
        <div class="card-content">
          <span class="work-label">作品 1</span>
        </div>
      </div>

      <div class="portfolio-card">
        <div class="card-content">
          <span class="work-label">作品 2</span>
        </div>
      </div>

      <div class="portfolio-card">
        <div class="card-content">
          <span class="work-label">作品 3</span>
        </div>
      </div>

            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 私のポートフォリオ</p>
    </footer>
</body>
</html>
